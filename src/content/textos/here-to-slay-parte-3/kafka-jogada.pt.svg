<circle cx="254" cy="134" r="11" fill="#cf3439"/>
<text x="254" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="312.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Gateway</text>
<text x="312.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">produz com</text>
<text x="312.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">chave = matchId</text>
<polyline points="392,160 424,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="424" y="112" width="160" height="96" rx="16" fill="#2b3a55" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="446" cy="134" r="11" fill="#cf3439"/>
<text x="446" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="504.0" y="160" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">game-actions-in</text>
<text x="504.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c9d1e3" text-anchor="middle">partição 2</text>
<polyline points="584,160 616,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="616" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="638" cy="134" r="11" fill="#cf3439"/>
<text x="638" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="696.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Engine B</text>
<text x="696.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">dona da</text>
<text x="696.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">partição 2</text>
<polyline points="776,160 808,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="808" y="112" width="160" height="96" rx="16" fill="#2b3a55" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="830" cy="134" r="11" fill="#cf3439"/>
<text x="830" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="888.0" y="160" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">game-state-out</text>
<text x="888.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c9d1e3" text-anchor="middle">novo estado</text>
<polyline points="968,160 1000,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="1000" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="1022" cy="134" r="11" fill="#cf3439"/>
<text x="1022" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="1080.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Gateways</text>
<text x="1080.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">repassam para</text>
<text x="1080.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">os jogadores</text>
<rect x="596" y="262" width="200" height="46" rx="12" fill="#fbe7e8" stroke="#cf3439" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="696.0" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#cf3439" text-anchor="middle">match-state-store</text>
<polyline points="696.0,208 696.0,262" fill="none" stroke="#cf3439" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-cf3439)"/>
<rect x="766.0" y="227" width="223.2" height="20" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="772.0" y="240" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cf3439" text-anchor="start">snapshot salvo ao criar a partida</text>
<text x="40" y="352" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5d6370" text-anchor="start">Se a engine B cair no meio da partida</text>
<rect x="40" y="372" width="200" height="96" rx="16" fill="#f1f2f4" stroke="#5d6370" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="140" y="418" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#5d6370" text-anchor="middle">Engine B cai</text>
<path d="M120,436 l40,20 M160,436 l-40,20" stroke="#cf3439" stroke-width="3" stroke-linecap="round"/>
<rect x="560" y="372" width="200" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<text x="660" y="412" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Engine C</text>
<text x="660" y="434" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">assume a</text>
<text x="660" y="449" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">partição 2</text>
<polyline points="240,420 560,420" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="320.4" y="391" width="159.2" height="36" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="400" y="404" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#2b3a55" text-anchor="middle">rebalance: a partição 2</text>
<text x="400" y="420" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#2b3a55" text-anchor="middle">passa para a engine C</text>
<polyline points="696.0,308 696.0,340 660,340 660,372" fill="none" stroke="#cf3439" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-cf3439)"/>
<rect x="705.0" y="317" width="127.2" height="36" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="711" y="330" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cf3439" text-anchor="start">relê o tópico</text>
<text x="711" y="346" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cf3439" text-anchor="start">do início, no boot</text>
<rect x="820" y="372" width="320" height="120" rx="16" fill="#fbe7e8" stroke="#cf3439" stroke-width="1.5"/>
<text x="840" y="398" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#cf3439" text-anchor="start">O que ainda falta</text>
<text x="840" y="420" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">O snapshot da partida só é salvo</text>
<text x="840" y="437" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">quando ela começa, e a releitura</text>
<text x="840" y="454" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">aponta para localhost. Para lobbies,</text>
<text x="840" y="471" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">a recuperação funciona.</text>
</svg>
