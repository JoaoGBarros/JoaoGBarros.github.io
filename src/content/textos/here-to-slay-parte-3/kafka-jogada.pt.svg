<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="O caminho de uma jogada pelo Kafka e o que acontece quando uma instância da engine cai">
<title>O caminho de uma jogada pelo Kafka e o que acontece quando uma instância da engine cai</title>
