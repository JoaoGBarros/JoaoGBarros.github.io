0 z" fill="#1c1f26"/></marker><marker id="tri-1c1f26" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#1c1f26" stroke-width="1.4"/></marker><marker id="dia-1c1f26" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#ffffff" stroke="#1c1f26" stroke-width="1.4"/></marker></defs>
<rect width="1180" height="560" rx="24" fill="#f1f2f4"/>
<text x="40" y="52" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#1c1f26" text-anchor="start">Uma jogada, e o que acontece quando a engine cai</text>
<text x="40" y="96" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5d6370" text-anchor="start">Caminho normal</text>
<rect x="40" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="62" cy="134" r="11" fill="#cf3439"/>
<text x="62" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="120.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Jogador</text>
<text x="120.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">clica em</text>
<text x="120.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">"jogar carta"</text>
<polyline points="200,160 232,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
