<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="The path of a move through Kafka and what happens when an engine instance dies">
<title>The path of a move through Kafka and what happens when an engine instance dies</title>
<defs><marker id="arrow-2b3a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a55"/></marker><marker id="tri-2b3a55" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.4"/></marker><marker id="dia-2b3a55" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#ffffff" stroke="#2b3a55" stroke-width="1.4"/></marker><marker id="arrow-cf3439" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf3439"/></marker><marker id="tri-cf3439" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#cf3439" stroke-width="1.4"/></marker><marker id="dia-cf3439" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#ffffff" stroke="#cf3439" stroke-width="1.4"/></marker><marker id="arrow-5d6370" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6370"/></marker><marker id="tri-5d6370" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#5d6370" stroke-width="1.4"/></marker><marker id="dia-5d6370" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#ffffff" stroke="#5d6370" stroke-width="1.4"/></marker><marker id="arrow-1c1f26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1f26"/></marker><marker id="tri-1c1f26" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#1c1f26" stroke-width="1.4"/></marker><marker id="dia-1c1f26" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#ffffff" stroke="#1c1f26" stroke-width="1.4"/></marker></defs>
<rect width="1180" height="560" rx="24" fill="#f1f2f4"/>
<text x="40" y="52" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#1c1f26" text-anchor="start">One move, and what happens when the engine dies</text>
<text x="40" y="96" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5d6370" text-anchor="start">Normal path</text>
<rect x="40" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="62" cy="134" r="11" fill="#cf3439"/>
<text x="62" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="120.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Player</text>
<text x="120.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">clicks</text>
<text x="120.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">"play card"</text>
<polyline points="200,160 232,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="232" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="254" cy="134" r="11" fill="#cf3439"/>
<text x="254" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="312.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Gateway</text>
<text x="312.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">produces with</text>
<text x="312.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">key = matchId</text>
<polyline points="392,160 424,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="424" y="112" width="160" height="96" rx="16" fill="#2b3a55" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="446" cy="134" r="11" fill="#cf3439"/>
<text x="446" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="504.0" y="160" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">game-actions-in</text>
<text x="504.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c9d1e3" text-anchor="middle">partition 2</text>
<polyline points="584,160 616,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="616" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="638" cy="134" r="11" fill="#cf3439"/>
<text x="638" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="696.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Engine B</text>
<text x="696.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">owns</text>
<text x="696.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">partition 2</text>
<polyline points="776,160 808,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="808" y="112" width="160" height="96" rx="16" fill="#2b3a55" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="830" cy="134" r="11" fill="#cf3439"/>
<text x="830" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="888.0" y="160" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">game-state-out</text>
<text x="888.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c9d1e3" text-anchor="middle">new state</text>
<polyline points="968,160 1000,160" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="1000" y="112" width="160" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<circle cx="1022" cy="134" r="11" fill="#cf3439"/>
<text x="1022" y="138.5" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="1080.0" y="160" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Gateways</text>
<text x="1080.0" y="180" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">forward to</text>
<text x="1080.0" y="195" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">the players</text>
<rect x="596" y="262" width="200" height="46" rx="12" fill="#fbe7e8" stroke="#cf3439" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="696.0" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#cf3439" text-anchor="middle">match-state-store</text>
<polyline points="696.0,208 696.0,262" fill="none" stroke="#cf3439" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-cf3439)"/>
<rect x="766.0" y="227" width="268.0" height="20" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="772.0" y="240" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cf3439" text-anchor="start">snapshot saved when the match is created</text>
<text x="40" y="352" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5d6370" text-anchor="start">If engine B dies mid-match</text>
<rect x="40" y="372" width="200" height="96" rx="16" fill="#f1f2f4" stroke="#5d6370" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="140" y="418" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#5d6370" text-anchor="middle">Engine B dies</text>
<path d="M120,436 l40,20 M160,436 l-40,20" stroke="#cf3439" stroke-width="3" stroke-linecap="round"/>
<rect x="560" y="372" width="200" height="96" rx="16" fill="#ffffff" stroke="#2b3a55" stroke-width="1.8"/>
<text x="660" y="412" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f26" text-anchor="middle">Engine C</text>
<text x="660" y="434" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">takes over</text>
<text x="660" y="449" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5d6370" text-anchor="middle">partition 2</text>
<polyline points="240,420 560,420" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#arrow-2b3a55)"/>
<rect x="323.6" y="391" width="152.8" height="36" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="400" y="404" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#2b3a55" text-anchor="middle">rebalance: partition 2</text>
<text x="400" y="420" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#2b3a55" text-anchor="middle">moves to engine C</text>
<polyline points="696.0,308 696.0,340 660,340 660,372" fill="none" stroke="#cf3439" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-cf3439)"/>
<rect x="705.0" y="317" width="159.2" height="36" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="711" y="330" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cf3439" text-anchor="start">re-reads the topic</text>
<text x="711" y="346" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cf3439" text-anchor="start">from the start, on boot</text>
<rect x="820" y="372" width="320" height="120" rx="16" fill="#fbe7e8" stroke="#cf3439" stroke-width="1.5"/>
<text x="840" y="398" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#cf3439" text-anchor="start">What is still missing</text>
<text x="840" y="420" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">The match snapshot is only saved</text>
<text x="840" y="437" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">when the match starts, and the reload</text>
<text x="840" y="454" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">points at localhost. For lobbies,</text>
<text x="840" y="471" font-family="Rubik, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1c1f26" text-anchor="start">recovery works.</text>
</svg>
