experiencias:
  - titulo: Back-end Software Engineer (Contract)
    org: Property Guys, Spanish proptech startup
    periodo: Mar 2026 – Present
    local: Remote, Spain
    pontos:
      - Sole software engineer on the backend and infrastructure of a production real-estate web platform for the Mallorca market, with 100,000+ listings aggregated from roughly 1,000 agency websites; I own the FastAPI web service and REST API, the crawler, servers, networking and deployment in a remote, English-speaking Scrum team.
      - Restructured the inherited monolith into Router-Service-Repository layers and fixed SQL injection, account-takeover and user-enumeration vulnerabilities.
      - Integrated the platform with external systems, building the Stripe subscription flow end to end (checkout, plans, billing portal, webhooks), Mapbox geocoding for location validation and LLM APIs for listing descriptions, plus lead routing for subscribed agencies.
      - Cut homepage load time by 84% and brought search to about 250 ms per page through PostgreSQL work, including B-tree and GIST spatial indexes, materialized views, N+1 query fixes and moving ranking logic into SQL.
      - Migrated production from Azure to Hetzner, provisioning the servers, the PostgreSQL instance, DNS and security, and cut hosting costs by roughly 75%.
      - Set up a Git workflow with protected branches and pull-request reviews, CI/CD in GitHub Actions with automatic rollback when integration tests fail, Pytest unit tests and daily database backups.
      - Unified the company’s two crawlers into a single versioned repository with a shared database write contract and automated deploys.
      - Designed the data-quality guards (sold and inactive listing detection, location validation, price recovery with Playwright, duplicate detection through pHash) and added a computer-vision step that removes stock photos, logos and agent portraits before publication.
  - titulo: Junior Software Engineer
    org: Software Engineering Practices Laboratory (LabES), UFES
    periodo: Aug 2023 – Mar 2026
    local: Vitória, Brazil
    pontos:
      - Software engineer on ES+ Criativo and HUB ES+, production web applications for the Espírito Santo State Secretariat of Culture that have supported 1,400+ events.
      - Built the first version of both systems in Java (Jakarta EE, JPA, JSF), from the relational data model to the web UI, then led the migration to PHP and WordPress, writing custom plugins.
      - Worked in a multidisciplinary team with designers and stakeholders, leading delivery meetings with the Secretariat and turning client needs into technical specifications.
      - Served as the team’s on-call engineer for production incidents and covered the full lifecycle, from requirements and documentation to code review, deployment and user guides.
  - titulo: Software Development Intern
    org: Vixteam Consultoria & Sistemas
    periodo: Dec 2021 – Feb 2023
    local: Vitória, Brazil
    pontos:
      - Built the end-to-end test suite for Team Audit, Vixteam’s audit-management web platform, with Protractor and TypeScript.
      - Fixed bugs across the full stack, from Angular and TypeScript components to Spring Boot services and REST APIs.

