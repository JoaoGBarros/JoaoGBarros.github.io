resumo: >-
  Engenheiro de Software com foco em aplicações web de ponta a ponta (REST APIs, backend, bancos SQL
  e frontends em React e TypeScript), formando em Engenharia de Computação em dezembro de 2026. Como
  único engenheiro de um marketplace imobiliário em produção com mais de 100.000 imóveis, sou
  responsável pelo web service em Python (FastAPI), pelo PostgreSQL e pelas integrações com sistemas
  externos (Stripe, Mapbox, LLMs). Experiência com Docker, Git, CI/CD e uso disciplinado de IA no
  desenvolvimento. Inglês fluente (C2) e acostumado a times remotos e ágeis.

