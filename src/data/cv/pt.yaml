experiencias:
  - titulo: Engenheiro de Software Backend (Contrato)
    org: Property Guys, startup proptech espanhola
    periodo: mar 2026 – presente
    local: Remoto, Espanha
    pontos:
      - Único engenheiro de um marketplace imobiliário em produção que agrega imóveis de cerca de 1.000 sites de imobiliárias em um dataset PostgreSQL de mais de 100.000 propriedades, responsável pela REST API em FastAPI, crawler, servidores e deploy, em um time remoto de língua inglesa em Scrum.
      - Refatorei o backend monolítico que herdei para uma estrutura em camadas Router-Service-Repository e reforcei a segurança em produção, substituindo SQL montado por string por queries parametrizadas e fechando vulnerabilidades de account takeover e de enumeração de usuários.
      - Integrei a plataforma a sistemas externos, com o fluxo de assinatura e pagamento com Stripe de ponta a ponta (checkout, planos, portal de cobrança e webhooks), geocodificação com Mapbox, integrações com LLMs e roteamento de leads das agências assinantes.
      - Reduzi o tempo de carregamento da página inicial em 84% e deixei a busca em cerca de 250 ms por página, com índices B-tree e GIST, materialized views, cache, correção de queries N+1 e ranqueamento no PostgreSQL.
      - Migrei a infraestrutura de produção da Azure para a Hetzner (servidores, PostgreSQL, DNS e segurança) e reduzi o custo de hospedagem em cerca de 75%.
      - Implantei a base de engenharia, com proteção de branch, revisão por pull request, CI/CD no GitHub Actions com rollback automático, mais de 50 módulos de testes em Pytest e backups diários.
      - Unifiquei os dois crawlers da empresa em um repositório versionado, com pipeline de extração, enriquecimento e validação, filas em Redis e deploy automatizado.
      - Criei validações de qualidade dos dados (imóveis vendidos e inativos, localização, preços com Playwright, duplicatas por pHash) e uma etapa de visão computacional que descarta fotos de banco de imagens, logos e retratos antes da publicação.
  - titulo: Engenheiro de Software Júnior
    org: Laboratório de Práticas de Engenharia de Software (LabES), UFES
    periodo: ago 2023 – mar 2026
    local: Vitória, Brasil
    pontos:
      - Construí e mantive o ES+ Criativo e o HUB ES+, plataformas web em produção da Secretaria de Cultura do Espírito Santo, que já apoiaram mais de 1.400 eventos.
      - Desenvolvi a versão inicial dos dois sistemas em Java (Jakarta EE, JPA e JSF), do modelo de dados à interface web, e executei a migração para PHP e WordPress, com plugins próprios.
      - Colaborei em um time multidisciplinar, com designers e stakeholders, conduzindo reuniões de entrega com a Secretaria e traduzindo as necessidades do cliente em especificações técnicas.
      - Atuei como engenheiro de plantão em incidentes de produção e participei de todo o ciclo, de requisitos e documentação a code review, deploy e manuais para usuários.
  - titulo: Estagiário de Desenvolvimento de Software
    org: Vixteam Consultoria & Sistemas
    periodo: dez 2021 – fev 2023
    local: Vitória, Brasil
    pontos:
      - Arquitetei e implementei uma suíte de testes end-to-end com Protractor e TypeScript para o Team Audit, aplicação Angular de grande porte.
